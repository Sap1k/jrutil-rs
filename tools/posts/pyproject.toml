[project]
name = "post-scorer"
version = "0.1.0"
description = "Training table, training and judging of the learned stop-post scorer"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "polars>=1.20",
    "pyarrow>=18",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
