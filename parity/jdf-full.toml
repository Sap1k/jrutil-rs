# Road package as production builds it: estimated posts, then the regional overlay (PID, IDS
# JMK). Every expected difference between the F# production build and jrutil-rs, with its reason.
#
#   jrutil compare <F# release>/jdf <jrutil-rs release>/jdf --expect parity/jdf-full.toml
#
# Counts are those of the national comparison of 2026-11-22/23 (docs/golden.md, "The national
# road comparison"): one production run of each compiler on the same sources. The categories
# are those of the overlay (parity/jdf-overlay.toml, which explains the pairing of trips by
# schedule) and of the estimated posts (parity/jdf-posts.toml), and at the end those only the
# national feed shows.

trip_identity = "journey"

[[label]]
relation = "service_note"
column = "source_object_id"
reason = "Names the source row. F# built it from the distinction its merge assigned to a line version; it now names the version by batch and the row by its own number (jdf-convert verdict Q14)."

[[label]]
relation = "assignment"
column = "source_object_id"
reason = "As for service_note."

[[label]]
relation = "connection_claim"
column = "source_object_id"
reason = "As for service_note: the claim is named by its trip and its position among the trip's claims."

[[label]]
relation = "travel_restriction"
column = "source_object_id"
reason = "As for service_note."

# --- Shared with the base package (parity/jdf.toml) ---

[[category]]
name = "note-text-trimmed"
matches = "assignment.missing"
reason = "As in the base package."
key = ' \}$'
max = 2638

[[category]]
name = "note-text-trimmed-new"
matches = "assignment.extra"
reason = "As in the base package."
key = '^route\|note\|'
max = 2583

[[category]]
name = "route-notes-once"
