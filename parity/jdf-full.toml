max = 335914

# --- Positions ---

[[category]]
name = "position-of-place-latitude"
matches = "location.changed.latitude"
reason = "The base package's centroid differences, and boarding points that have no position of their own: they stand at their place, so when a source's coordinates replace the place's (R091) they move with it. F# kept the old coordinates on those rows."
max = 5484

[[category]]
name = "position-of-place-longitude"
matches = "location.changed.longitude"
reason = "As for the latitude."
max = 5216

[[category]]
name = "replaced-coordinate-source"
matches = "location.changed.coordinate_source"
reason = "A coordinate the overlay replaced says so (verdict Q13, B4): F# left the national source's name on it."
b = '^overlay$'
max = 36000

[[category]]
name = "corrected-place-exact"
matches = "location.changed.coordinate_precision"
reason = "An estimated national stop corrected from a source (R046) is exact, and so are the boarding points standing at it (Q13)."
a = '^estimated$'
b = '^exact$'
max = 55

[[category]]
name = "corrected-place-name"
matches = "location.changed.name"
reason = "The boarding points of a corrected stop show its corrected name; F# kept the estimate's marked name on them."
a = ' \[\?\]$'
max = 32

[[category]]
name = "public-code-trimmed"
matches = "location.changed.public_code"
reason = "A platform code is trimmed of surrounding spaces."
max = 1

[[category]]
name = "long-name-trimmed"
matches = "route.changed.long_name"
reason = "A route long name is trimmed of surrounding spaces."
max = 9

# --- Conflicts on owned line-dates (verdict Q3, B23) ---

[[category]]
name = "conflict-keeps-national-trip"
matches = "trip.changed.service_id"
reason = "Where two source trips claim one national trip with different facts on a date the source owns the line, F# removed the national trip on that date although it reported the national value as retained. The trip keeps the date (1,398 trips, 3,006 trip-dates, each an overlay_fact_conflict date). Also the trips of line 728444 that lose dates to the authority below. Nationally also: the trips of JDF 1.8/1.9 batches, whose time codes keep their type (jdf-read B1: 1,405 trips run on 26,782 fewer trip-dates and 279 more), and the trips that hold the dates of F#'s chunk trips (version-chunk-trips)."
max = 4663

# --- Authority gained on IDS JMK line 444 ---

[[category]]
name = "authority-added-trips"
matches = "trip.extra"
reason = "The F# base published trip-less routes for lines 335, 442, 444 and 662 (parity/jdf.toml, routes-without-trips), which made the line of the source's route ambiguous, so authority was withheld. The base no longer has them: the source owns the line on its dates, its trips are added and the national ones retire (39 trips of route L444D99)."
key = '^overlay:ids-jmk-gtfs:trip:'
max = 39

[[category]]
name = "authority-added-calls"
matches = "trip_call.extra"
reason = "The calls of the added trips above."
key = '^overlay:ids-jmk-gtfs:trip:'
max = 525

[[category]]
