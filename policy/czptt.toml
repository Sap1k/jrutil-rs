# Constants of the CZPTT rail compiler (crates/jr-czptt, docs/rules/czptt.md).
# Every value here belongs to a named rule; the rule IDs are given per section.

# CZPTT-R011, Q1: the published form of a PA/TR identifier, `<type>:<company>:<core>:<variant>:<year>`.
[identifiers]
path_object_type = "Pa"
train_object_type = "Tr"

# CZPTT-R002: CZPTTCreation / CZPTTCancelation without an offset are local times in this zone.
[ordering]
naive_timestamp_zone = "Europe/Prague"

# CZPTT-R116, Q2: the GVD window is widened so that runs moved by R066 keep their dates.
[horizon]
days_before = 1
days_after = 1

# CZPTT-R013, R015, R065: BitmapDays characters.
[calendar]
running_day = "1"
not_running_day = "0"

# CZPTT-R081: `<prefix><newest CZPTTCreation, local reading, in this strftime format>`.
[source_version]
prefix = "czptt:"
format = "%Y%m%dT%H%M%S"

# CZPTT-R027: the Timing qualifiers that are read; others are diagnosed and ignored.
[timing]
arrival_qualifier = "ALA"
departure_qualifier = "ALD"

# CZPTT-R029, R030, Q7: TrainActivityType codes.
[activities]
passenger = "0001"
embark_only = "0028"
disembark_only = "0029"
request_stop = "0030"
unpublished_stop = "CZ13"
# Every code the CZPTT standard defines; any other code is diagnosed (R030).
known = [
    "0001", "0002", "0026", "0027", "0028", "0029", "0030", "0031", "0032", "0033",
    "0035", "0040", "0043", "0044", "CZ01", "CZ02", "CZ03", "CZ04", "CZ05", "CZ13",
]

# CZPTT-R031–R037: NetworkSpecificParameter names and the values that set a flag.
[parameters]
line = "CZPassengerServiceNumber"
replacement_bus = "CZAlternativeTransport"
replacement_bus_value = "1"
inconsistent_time = "CZInconsistentTime"
inconsistent_time_value = "1"

# CZPTT-R034: the category of a train before any location names one.
[category]
default_label = "Vlak"

# CZPTT-R035, R045: GTFS extended route types.
[route_types]
default = 100
replacement_bus = 714

[[route_types.classes]]
route_type = 102
categories = ["IC", "EC", "RJ", "rj", "LE", "SC", "AEx"]

[[route_types.classes]]
route_type = 103
categories = ["R", "Ex", "Rx"]

[[route_types.classes]]
route_type = 106
categories = ["Os", "Sp", "TL", "TLX", "LET"]

[[route_types.classes]]
route_type = 105
categories = ["NJ", "EN", "ES"]

# CZPTT-R043, R047: the fewest calls a path or a replacement-bus part may have.
[parts]
minimum_calls = 2

# CZPTT-R053, R080: the zone of stop places and agencies; operational points have none.
[places]
timezone = "Europe/Prague"

# CZPTT-R054: CZPTT tracks are operational markings, not the platforms passengers see, so their
# names are not published until a track-to-platform mapping exists (SŽ assigns platforms
# statically from the 2027 timetable). The tracks stay boarding points with their sr70:track keys.
[tracks]
public_code = false

# CZPTT-R054, R055: where a replacement bus calls at a station.
[replacement_bus_point]
public_code = "BUS"
description = "Pro přesné informace k nástupišti náhradní dopravy sledujte informace dopravce."

# CZPTT-R080: agencies from KADR companies.
[agencies]
timezone = "Europe/Prague"
language = "cs"
# A catalogue name is cut at the first occurrence of this qualifier separator.
qualifier_separator = " - "
# The name of an operator the catalogue lacks: `<prefix><code>`.
unknown_name_prefix = "Unknown "
# Prepended to a URL without a scheme; only these schemes are kept.
default_scheme = "https"
schemes = ["http", "https"]
# A missing or unusable company URL becomes this (GTFS requires agency_url).
default_url = "https://portal.cisjr.cz/"

# CZPTT-R058, R061: route labels and colours.
[routes]
replacement_bus_suffix = " (NAD)"
text_color = "ffffff"
default_color = "475569"

[[routes.colors]]
route_type = 106
color = "1c1745"

[[routes.colors]]
route_type = 102
color = "b91c1c"

[[routes.colors]]
route_type = 103
color = "b45309"

[[routes.colors]]
route_type = 105
color = "4c1d95"

# Serving §4 rows 9 and 10: which places carry an `sr70` key.
[keys]
sr70_country = "CZ"
sr70_code_length = 5

# CZPTT-R071–R075: note parameters, their fields and the note ID kinds.
[notes]
central = "CZCentralPTTNote"
local = "CZNonCentralPTTNote"
calendar = "CZCalendarPTTNote"
field_separator = "|"
date_format = "%Y%m%d"
central_kind = "central"
local_kind = "noncentral"
calendar_kind = "calendar"

# CZPTT-R070, R077: central note codes and what they say about a trip.
[features]
wheelchair_codes = ["17", "34"]
bicycle_codes = ["22", "26", "27", "28", "29"]
bicycle_prohibited_codes = ["36"]

[[features.central]]
code = "17"
kinds = ["wheelchair_accessible_vehicle", "wheelchair_booking_recommended"]

[[features.central]]
code = "34"
kinds = ["wheelchair_accessible_vehicle", "wheelchair_booking_required"]

[[features.central]]
code = "22"
kinds = ["bicycle_transport", "bicycle_carry_on"]

[[features.central]]
code = "26"
kinds = ["bicycle_transport", "bicycle_storage", "bicycle_reservation_available"]

[[features.central]]
code = "27"
kinds = ["bicycle_transport", "bicycle_storage", "bicycle_reservation_required"]

[[features.central]]
code = "28"
kinds = ["bicycle_transport", "bicycle_carry_on", "bicycle_reservation_available"]

[[features.central]]
code = "29"
kinds = ["bicycle_transport", "bicycle_carry_on", "bicycle_reservation_required"]

[[features.central]]
code = "36"
kinds = ["bicycle_transport_prohibited"]

# CZPTT-R085, R086: IDS zone memberships.
[zones]
parameter = "CZIPTS"
# CZPTT-R119: a CZIPTS value's sixth field names one of these (`id|from|to|bitmap|`).
calendar_parameter = "CZCalendarIPTS"
# The catalogue note names a fare band as `… <word> <band>` (case-insensitive).
fare_band_word = "pásmo"
system_separator = "_"

# CZPTT-R083: connections between a separately published replacement bus and its train.
[connections]
max_gap_seconds = 600
train_number_offset = 300000
