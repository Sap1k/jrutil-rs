# Constants of the rail coordinates pass (crates/jr-enrich/src/rail_coordinates.rs) and of the
# name rules it uses (crates/jr-geo/src/names.rs). Rule IDs are those of docs/rules/czptt.md;
# every value belongs to the rule named above its section.

# CZPTT-R018–R021: SR70.csv rows. A code is its first `code_length` characters (a six-digit
# SR70 code loses its check digit); a name equal to `name_placeholder` is no name. SR70 places
# points of `country` only (R097).
[sr70]
country = "CZ"
code_length = 5
name_placeholder = "-"

# CZPTT-R022–R025: OSM candidates.
[osm]
# R022: a node is a candidate when one of these tags has one of the listed values (verdict Q6
# keeps the public_transport branch). Values compare case-sensitively.
eligible = [
    { key = "railway", values = ["station", "halt", "stop"] },
    { key = "public_transport", values = ["station", "stop_position"] },
]
# R023: whitespace removed, upper-cased, kept when `plc_country_letters` ASCII letters are
# followed by `plc_code_digits` ASCII digits.
plc_tag = "ref:EU:PLC"
plc_country_letters = 2
plc_code_digits = 5
# R024: the country when the PLC gives none, first non-blank tag wins; values trimmed,
# upper-cased and mapped through `country_alpha3`.
country_tags = ["addr:country", "is_in:country_code"]
# R025: name tags in this order; values trimmed, blanks and repeats dropped.
name_tags = [
    "name", "official_name", "alt_name", "short_name", "loc_name", "old_name", "uic_name",
    "name:cs", "name:de", "name:pl", "name:sk",
]

# CZPTT-R024: alpha-3 country tags to alpha-2; other values are kept as written.
[osm.country_alpha3]
AUT = "AT"
CZE = "CZ"
DEU = "DE"
POL = "PL"
SVK = "SK"

# CZPTT-R090–R093 (jr_geo::names::NameTables).
[names]
# R090: combining marks dropped (Combining Diacritical Marks and their extensions and supplement,
# combining half marks).
marks = [
    ["\u0300", "\u036F"],
    ["\u1AB0", "\u1AFF"],
    ["\u1DC0", "\u1DFF"],
    ["\uFE20", "\uFE2F"],
]
# R091: the normalised forms are compared.
railway_suffix_tokens = [
    "Bf", "Fbf", "Gr", "Hp", "Hst", "N", "Nz", "Pzs", "S", "St", "Z", "Zast", "Zastavka",
]
route_section_prefix = "R"
qualifier_open = "("
qualifier_close = ")"
# R093.
protected_qualifiers = [
    "Ost", "West", "Nord", "Süd", "Mitte",
    "východ", "západ", "sever", "jih", "juh", "střed",
    "Wschód", "Zachód", "Północ", "Południe", "Górna", "Dolna",
    "město", "mesto", "miasto", "centrum",
]

# R090: one character to its replacement. The letters that do not decompose (ß ẞ Ł ł Ø ø Æ æ)
# and, for U+00C0–U+024F, every letter's canonical decomposition with its marks removed.
