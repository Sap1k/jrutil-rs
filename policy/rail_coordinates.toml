# CZPTT-R094–R095: OSM candidate groups and the corridor veto (R096 ranks without constants).
[matching]
# R094: fuzzy candidates need this best compatible similarity; the best `fuzzy_max_candidates`
# by score (then node ID) are kept.
fuzzy_min_similarity = 0.58
fuzzy_max_candidates = 32
# R095: an edge is plausible within slack + elapsed time × speed.
corridor_slack_m = 2000.0
corridor_speed_kmh = 150.0

# CZPTT-R097: an OSM node with the point's PLC farther than this from SR70 is reported.
[authority]
sr70_osm_disagreement_m = 1.0

# CZPTT-R098: passes that re-resolve every non-SR70 point against all other picks.
[resolution]
reevaluation_passes = 2

# CZPTT-R100, verdict Q12: past the last anchor, a point is placed this far north per call.
[estimate]
route_end_offset_m_per_call = 300.0
metres_per_degree_latitude = 111320.0
